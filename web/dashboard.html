
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>ESP32-S3 Controller Dashboard</title>
  <style>
    :root {
      --primary: #2563eb;
      --blue: #1e40af;
      --green: #15803d;
      --orange: #c2410c;
      --pink: #be185d;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #334155;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .outer-page {
      display: none
    }

    .outer-page.active {
      display: block
    }

    .dp {
      background: #FFFECB;
      color: #334155;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px;
    }

    .dp-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(12, 16, 24, .95);
      border-bottom: 1px solid #1a2540
    }

    .dp-logo {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dp-logo-icon {
      width: 30px;
      height: 30px;
      border: 2px solid #e6a817;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #e6a817;
      font-weight: 900
    }

    .dp-logo-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff
    }

    .dp-logo-text span {
      color: #e6a817
    }

    .dp-time {
      font-family: 'Courier New', monospace;
      text-align: center
    }

    .dp-time .t {
      font-size: 15px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px
    }

    .dp-time .d {
      font-size: 8px;
      color: #555;
      letter-spacing: 1px
    }

    .dp-gear {
      width: 32px;
      height: 32px;
      background: #141c2d;
      border: 1px solid #1a2540;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition: all .3s;
      color: #8b949e
    }

    .dp-gear:hover {
      background: #1a2540;
      transform: rotate(90deg);
      color: #e6a817
    }

    #mainHookGrp,
    #auxHookGrp {
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dp-toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d2818;
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, .2);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      z-index: 10002;
      transition: top .4s ease;
      letter-spacing: .5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .4)
    }

    .dp-toast.show {
      top: 16px
    }

    .dp-dc-ov {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 18, .92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10003;
      backdrop-filter: blur(6px);
      flex-direction: column;
      gap: 16px
    }

    .dp-dc-ov.show {
      display: flex
    }

    .dp-dc-icon {
      font-size: 48px;
      animation: dcPulse 1.5s infinite
    }

    .dp-dc-title {
      font-size: 18px;
      font-weight: 800;
      color: #ff4444;
      letter-spacing: 2px;
      text-transform: uppercase
    }

    .dp-dc-sub {
      font-size: 12px;
      color: #555;
      max-width: 260px;
      text-align: center;
      line-height: 1.5
    }

    .dp-dc-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 12px rgba(255, 68, 68, .6);
      animation: dcPulse 1.5s infinite
    }

    @keyframes dcPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .4;
        transform: scale(.9)
      }
    }

    .dp-main {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      min-height: calc(100vh - 80px);
      align-items: center
    }

    .dp-crane {
      width: 100%;
      flex: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      overflow: visible
    }

    .dp-crane svg {
      width: 100%;
      height: auto;
      max-height: 95vh;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5))
    }

    .dp-gauge-wrap {
      width: 100%;
      max-width: 500px;
      flex: 1;
      background: rgba(17, 24, 39, .85);
      border: 1px solid #1a2540;
      border-radius: 16px;
      padding: 10px 20px;
      margin-bottom: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .dp-gauge-wrap svg {
      width: 100%;
      max-width: 240px
    }

    .dp-gauge-label {
      font-size: 14px;
      color: #8b949e;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 10px;
      text-align: center
    }

    .dp-gauge-max {
      font-size: 15px;
      color: #e6a817;
      font-weight: 700;
      text-align: center;
      margin-top: 4px
    }

    @media(max-width:420px) {
      .dp-main {
        flex-direction: column
      }

      .dp-gauge-wrap {
        width: 100%;
        padding: 12px
      }
    }

    .dp-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 10px
    }

    .dc {
      background: linear-gradient(135deg, rgba(17, 24, 39, .9), rgba(12, 16, 24, .95));
      border: 1px solid #1e2d4a;
      border-left: 3px solid #00ff88;
      border-radius: 12px;
      padding: 14px 16px;
      position: relative;
      transition: border-color .3s
    }

    .dc:nth-child(2) {
      border-left-color: #60a5fa
    }

    .dc:nth-child(3) {
      border-left-color: #06b6d4
    }

    .dc:nth-child(4) {
      border-left-color: #f59e0b
    }

    .dc:nth-child(5) {
      border-left-color: #e6a817
    }

    .dc-hdr {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px
    }

    .dc-num {
      font-size: 11px;
      color: #e6a817;
      font-weight: 800
    }

    .dc-title {
      font-size: 11px;
      color: #c9d1d9;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      flex: 1
    }

    .dc-dots {
      color: #2a3550;
      font-size: 14px;
      letter-spacing: -1px
    }

    .dc-body {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .dc-val {
      font-family: 'Courier New', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1
    }

    .dc-val span {
      font-size: 16px;
      color: #c9d1d9;
      font-weight: 600;
      margin-left: 3px
    }

    .dc-ring {
      width: 44px;
      height: 44px;
      flex-shrink: 0
    }

    .dc-ring svg {
      width: 100%;
      height: 100%
    }

    .dc-sub {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
      font-weight: 600
    }

    .dp-safety {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 10px 10px
    }

    .dp-sf {
      background: linear-gradient(135deg, rgba(17, 24, 39, .9), rgba(12, 16, 24, .95));
      border: 1px solid #1e2d4a;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center
    }

    .dp-sf .sl {
      font-size: 10px;
      color: #c9d1d9;
      text-transform: uppercase;
      letter-spacing: .8px;
      font-weight: 700;
      margin-bottom: 5px
    }

    .dp-sf .sv {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px
    }

    .dp-sf .sv .sd {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block
    }

    .dp-sf.ok .sv {
      color: #00ff88
    }

    .dp-sf.ok .sv .sd {
      background: #00ff88;
      box-shadow: 0 0 6px rgba(0, 255, 136, .5)
    }

    .dp-sf.alarm .sv {
      color: #ff4444;
      animation: dpB .6s infinite
    }

    .dp-sf.alarm .sv .sd {
      background: #ff4444;
      box-shadow: 0 0 6px rgba(255, 68, 68, .5)
    }

    .dp-sf.off .sv {
      color: #444
    }

    .dp-sf.off .sv .sd {
      background: #222
    }

    @keyframes dpB {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .dp-ft {
      text-align: center;
      padding: 12px;
      font-size: 8px;
      color: #222
    }

    /* CALIBRATION/SETTINGS UI STYLES */
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      color: var(--text);
    }

    #settingsPage h1 {
      padding: 20px;
      background: white;
      text-align: center;
      color: var(--blue);
      text-transform: uppercase;
    }

    #settingsPage h2 {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding-bottom: 10px;
    }

    .switch-tabs {
      display: flex;
      padding: 10px 20px;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .dashboard {
      background: #1e293b;
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
      color: white;
    }

    .val-big {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fbbf24;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 15px;
      gap: 15px;
    }

    .val-med,
    .val-sub {
      font-size: 1.2rem;
      font-weight: 700;
      color: #34d399;
    }

    .zero-box {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-nav {
      margin: 20px;
      display: block;
      background: #f1f5f9;
      text-align: center;
      width: calc(100% - 40px);
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    .field-row input {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 100px;
    }

    table {
      width: calc(100% - 40px);
      margin: 20px;
      border-collapse: collapse;
    }

    th {
      background: #f8fafc;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .card {
      margin: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 20px;
      background: #f8fafc;
      font-weight: 800;
      border-bottom: 1px solid #e2e8f0;
    }

    .card-body {
      padding: 20px;
    }

    .hud-switch {
      position: relative;
      display: inline-block;
      width: 120px;
      height: 34px;
    }

    .hud-switch input {
      display: none;
    }

    .hud-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e2e8f0;
      border-radius: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .hud-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .hud-switch input:checked+.hud-track .hud-knob {
      transform: translateX(86px);
      background: #10b981;
    }

    .hud-txt {
      font-size: 0.7rem;
      font-weight: 800;
      color: #64748b;
    }

    .pw-ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      padding: 20px;
      backdrop-filter: blur(4px)
    }

    .pw-ov.show {
      display: flex
    }

    .pw-bx {
      background: #111827;
      border: 1px solid #1a2540;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center
    }

    .pw-inp {
      width: 100%;
      padding: 12px;
      background: #0c1018;
      border: 1.5px solid #1a2540;
      border-radius: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 18px;
      margin-top: 15px;
      text-align: center;
    }

    .sp-back {
      padding: 15px 20px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }
    
    #relay-controls .relay-item { padding: 10px 0; border-bottom: 1px solid #eee; }
    .relay-btn-grid { display: flex; gap: 5px; margin-top: 5px; }
    .r-chip { flex: 1; padding: 5px; background: #f1f5f9; border-radius: 4px; text-align: center; font-size: 0.7rem; cursor: pointer; font-weight: 800; }
    .r-chip.active { background: #10b981; color: white; }
  </style>
</head>

<body>

  <!-- Password Modal -->
  <div class="pw-ov" id="dpPwModal">
    <div class="pw-bx">
      <div style="font-size:36px">🔒</div>
      <div style="color:#c9d1d9; font-weight:700; margin-top:10px">Admin Access</div>
      <input type="password" id="dpPwInput" class="pw-inp" placeholder="••••" maxlength="4">
      <div id="dpPwErr" style="color:#ff4444; font-size:11px; display:none; margin-top:5px">Wrong password</div>
      <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn" style="background:#1a2540; color:#888; flex:1" onclick="dpClosePw()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="dpCheckPw()">Login</button>
      </div>
    </div>
  </div>

  <!-- Dashboard Page -->
  <div id="dashboardPage" class="outer-page active dp">
    <div class="dp-hdr">
      <div class="dp-logo">
        <div class="dp-logo-icon">H</div>
        <div class="dp-logo-text"><span>ESP32-S3</span> TECH</div>
      </div>
      <div class="dp-time">
        <div class="t" id="dpClk">--:--:--</div>
        <div class="d" id="dpDate">---</div>
      </div>
      <div class="dp-gear" onclick="dpShowSettings()">⚙</div>
    </div>

    <div class="dp-main">
      <div class="dp-crane">
        <svg viewBox="15 0 270 420">
          <defs>
            <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5c518" />
              <stop offset="40%" stop-color="#e8a817" />
              <stop offset="100%" stop-color="#b07a05" />
            </linearGradient>
            <linearGradient id="gYs" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c99a0a" />
              <stop offset="100%" stop-color="#7a5500" />
            </linearGradient>
            <linearGradient id="gYt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e8b015" />
              <stop offset="100%" stop-color="#a07500" />
            </linearGradient>
            <linearGradient id="gBl" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4a90d9" />
              <stop offset="50%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#1a3fa0" />
            </linearGradient>
            <linearGradient id="gSt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5a6578" />
              <stop offset="50%" stop-color="#3d4555" />
              <stop offset="100%" stop-color="#2a3040" />
            </linearGradient>
            <linearGradient id="gHk" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e8b015" />
              <stop offset="100%" stop-color="#8a6000" />
            </linearGradient>
            <linearGradient id="gScr" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#080808" />
              <stop offset="100%" stop-color="#000000" />
            </linearGradient>
            <linearGradient id="gHk2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1a1a1a" />
              <stop offset="30%" stop-color="#333" />
              <stop offset="60%" stop-color="#050505" />
              <stop offset="100%" stop-color="#000" />
            </linearGradient>
            <filter id="sh1">
              <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity=".35" />
            </filter>
            <filter id="sh2">
              <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-opacity=".25" />
            </filter>
            <filter id="glow">
              <feGaussianBlur stdDeviation="1.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="0.5" />
              <circle cx="0" cy="0" r="0.5" fill="rgba(0,0,0,0.1)" />
            </pattern>
          </defs>
          <rect x="0" y="0" width="300" height="420" fill="url(#grid)" />
          <rect x="15" y="0" width="2" height="420" fill="rgba(255,255,255,0.05)" />
          <rect x="283" y="0" width="2" height="420" fill="rgba(255,255,255,0.05)" />

          <!-- ===== BUILDING STRUCTURE ===== -->
          <!-- Back columns (depth) -->
          <rect x="32" y="8" width="6" height="405" fill="#1a2540" opacity="0.5" />
          <rect x="262" y="8" width="6" height="405" fill="#1a2540" opacity="0.5" />
          <!-- Front columns (I-beam look) -->
          <rect x="16" y="5" width="4" height="410" fill="#2a3550" />
          <rect x="20" y="5" width="6" height="410" fill="url(#gSt)" />
          <rect x="26" y="5" width="4" height="410" fill="#2a3550" />
          <rect x="270" y="5" width="4" height="410" fill="#2a3550" />
          <rect x="274" y="5" width="6" height="410" fill="url(#gSt)" />
          <rect x="280" y="5" width="4" height="410" fill="#2a3550" />
          <!-- Column cross-braces -->
          <line x1="20" y1="30" x2="30" y2="70" stroke="#1e2840" stroke-width="1.2" />
          <line x1="30" y1="30" x2="20" y2="70" stroke="#1e2840" stroke-width="1.2" />
          <line x1="20" y1="80" x2="30" y2="120" stroke="#1e2840" stroke-width="1.2" />
          <line x1="30" y1="80" x2="20" y2="120" stroke="#1e2840" stroke-width="1.2" />
          <line x1="20" y1="130" x2="30" y2="170" stroke="#1e2840" stroke-width="1.2" />
          <line x1="30" y1="130" x2="20" y2="170" stroke="#1e2840" stroke-width="1.2" />
          <line x1="20" y1="180" x2="30" y2="220" stroke="#1e2840" stroke-width="1.2" />
          <line x1="30" y1="180" x2="20" y2="220" stroke="#1e2840" stroke-width="1.2" />
          <line x1="270" y1="30" x2="280" y2="70" stroke="#1e2840" stroke-width="1.2" />
          <line x1="280" y1="30" x2="270" y2="70" stroke="#1e2840" stroke-width="1.2" />

  <script>
    const $ = id => document.getElementById(id);
    const api = async url => { try { const r = await fetch(url); return await r.text(); } catch(e) { return null; } };

    let hook='main', raw=0, clickCount=0;
    function dpShowSettings(){ $('dpPwInput').value=''; $('dpPwModal').classList.add('show'); $('dpPwInput').focus(); }
    function dpClosePw(){ $('dpPwModal').classList.remove('show'); }
    function dpCheckPw(){ if($('dpPwInput').value==='1234'){ dpClosePw(); window.location.href='/settings'; } else { $('dpPwErr').style.display='block'; } }
    function secret(){ clickCount++; if(clickCount===5){ window.location.href='/settings'; clickCount=0; } }

    function updateGauge(val, max) {
      let pct = max > 0 ? Math.min(val / max * 100, 100) : 0;
      let arc = $('gaugeArc');
      arc.setAttribute('stroke-dashoffset', 427.3 * (1 - pct/100));
      // Color changes based on load
      let col;
      if (pct < 60) col = '#00ff88';
      else if (pct < 80) col = '#f59e0b';
      else if (pct < 95) col = '#f97316';
      else col = '#ff4444';
      arc.setAttribute('stroke', col);
      $('gaugeVal').textContent = val.toFixed(2);
      $('gaugeVal').setAttribute('fill', pct >= 95 ? '#ff4444' : '#e6a817');
      $('gaugeMax').textContent = max > 0 ? max + ' T' : '-- T';
      $('dpGaugeMaxLabel').textContent = max > 0 ? 'MAX ' + max + ' tons' : 'MAX -- tons';
    }
    function updateRing(id, pct, txtId) {
      let el = $(id); if(!el) return;
      el.setAttribute('stroke-dashoffset', 88 - 88 * Math.min(pct,100)/100);
      el.setAttribute('stroke', pct < 85 ? (id==='ringMain'?'#00ff88':'#60a5fa') : '#ff4444');
      if($(txtId)) $(txtId).textContent = Math.round(pct) + '%';
      let grp = id==='ringMain'?$('mainHookGrp'):$('auxHookGrp'), wires = id==='ringMain'?$('wireMain'):$('wireAux');
      let offset = (pct/100)*40;
      if(grp) grp.style.transform = `translateY(${15 + offset}px)`;
      if(wires) Array.from(wires.getElementsByTagName('line')).forEach(l => l.setAttribute('y2', (id==='ringMain'?121:128)+offset));
    }

    let dpMainCap=0, dpAuxCap=0, dpMainEn=false, dpAuxEn=false;
    async function dpTick() {
      const res = await api('/liveWeight');
      if(res) {
        const w = JSON.parse(res);
        if($('dpMain')) $('dpMain').innerHTML = Number(w.main).toFixed(2) + ' <span>tons</span>';
        $('svgMain').textContent = Number(w.main).toFixed(2) + ' T';
        if($('svgAux')) $('svgAux').textContent = Number(w.aux).toFixed(2) + ' T';
        
        let total = Number(w.total), max = (dpMainEn?dpMainCap:0) + (dpAuxEn?dpAuxCap:0);
        updateGauge(total, max);
        updateRing('ringMain', dpMainCap>0?(w.main/dpMainCap*100):0, 'ringMainTxt');
        if($('ringAux')) updateRing('ringAux', dpAuxCap>0?(w.aux/dpAuxCap*100):0, 'ringAuxTxt');
        
        $('dpDcOverlay').classList.remove('show');
      } else {
        if($('dpDcOverlay')) $('dpDcOverlay').classList.add('show');
      }
    }
    async function loadConfigs() {
      const m = JSON.parse(await api('/getMainConfig') || '{}'); dpMainCap = m.capacity||0; dpMainEn = !!m.enable;
      const a = JSON.parse(await api('/getAuxConfig') || '{}'); dpAuxCap = a.capacity||0; dpAuxEn = !!a.enable;
      $('dpGaugeMaxLabel').textContent = 'MAX ' + ((dpMainEn?dpMainCap:0)+(dpAuxEn?dpAuxCap:0)) + ' tons';
    }

    setInterval(dpTick, 800);
    loadConfigs();
    
    function dpClock() { 
      let d=new Date(), h=String(d.getHours()).padStart(2,'0'), m=String(d.getMinutes()).padStart(2,'0'), s=String(d.getSeconds()).padStart(2,'0'); 
      let mn=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']; 
      $('dpClk').textContent=h+':'+m+':'+s; $('dpDate').textContent=mn[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
    }
    dpClock(); setInterval(dpClock, 1000);
  </script>
